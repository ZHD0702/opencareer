    - "没人理解"
    - "孤立"
    - " alone"
    - "lonely"
    - "isolated"
  general_negative:
    - "难过"
    - "不开心"
    - "伤心"
    - "失望"
    - "痛苦"
    - " sad"
    - "unhappy"
    - "depressed"
    - "down"
    - "upset"
    - "disappointed"

# Job-related keywords for handoff detection
job_keywords:
  - "简历"
  - "面试"
  - "求职"
  - "工作"
  - " offer"
  - "跳槽"
  - "投递"
  - "招聘"
  - "resume"
  - "interview"
  - "job"
  - "career"
  - "hire"
  - "recruit"

# ---------------------------------------------------------------------------
# Complex emotions list + intensity words for skill usage heuristic
# ---------------------------------------------------------------------------
complex_emotions:
  - stress_anxiety
  - discouragement
  - confidence_issues
  - burnout_fatigue

intensity_words:
  - "very"
  - "extremely"
  - "really"
  - "so"
  - "too"
  - "completely"
  - "很"
  - "非常"
  - "特别"
  - "太"
  - "极"
