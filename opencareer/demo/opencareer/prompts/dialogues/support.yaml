    - "压力"
    - "焦虑"
    - "紧张"
    - "担心"
    - "害怕"
    - "不安"
    - "慌"
    - "stress"
    - "anxious"
    - "nervous"
    - "worried"
    - "overwhelmed"
    - "panic"
  discouragement:
    - "沮丧"
    - "失望"
    - "灰心"
    - "放弃"
    - "挫败"
    - "失败"
    - " rejection"
    - "rejected"
    - "discouraged"
    - "frustrated"
    - "hopeless"
    - "defeated"
  confidence_issues:
    - "不自信"
    - "不够好"
    - "不行"
