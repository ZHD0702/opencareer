# Emotional support configuration for EmotionAgent
# Used by: emotion_agent.py
# Note: All pre-made response text has been removed.
# Response generation is handled by LLMClient.

# ---------------------------------------------------------------------------
# Emotion keyword triggers
# ---------------------------------------------------------------------------
